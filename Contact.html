><!-- Email Subject --> <input type="hidden" name="subject" value="KaamKit Contact Form Message" > <!-- Spam protection --> <input type="checkbox" name="botcheck" style="display:none" > <div class="field-group"> <label for="contactName"> آپ کا نام </label> <input type="text" id="contactName" name="name" placeholder="اپنا نام درج کریں" required > </div> <div class="field-group"> <label for="contactEmail"> Email </label> <input type="email" id="contactEmail" name="email" placeholder="example@email.com" dir="ltr" required > </div> <div class="field-group"> <label for="contactSubject"> موضوع </label> <input type="text" id="contactSubject" name="message_subject" placeholder="مثلاً Tool میں مسئلہ" required > </div> <div class="field-group"> <label for="contactMessage"> پیغام </label> <textarea id="contactMessage" name="message" rows="7" placeholder="اپنا پیغام یہاں لکھیں..." required ></textarea> </div> <button id="contactSubmitBtn" class="primary-btn" type="submit" > 📩 پیغام بھیجیں </button> <div id="contactMessageResult" class="tool-message" ></div> </form> </div> </section> </main> <!-- ==================== FOOTER ==================== --> <footer class="site-footer"> <div class="container"> <div class="footer-brand"> <strong>KaamKit</strong> <p> روزمرہ کے ضروری کام، ایک جگہ۔ </p> </div> <div class="footer-links"> <a href="index.html"> Home </a> <a href="Privacy.html"> Privacy Policy </a> <a href="Terms.html"> Terms & Conditions </a> </div> <p class="copyright"> © 2026 KaamKit. All rights reserved. </p> </div> </footer> <!-- ==================== CONTACT JAVASCRIPT ==================== --> <script> const contactForm = document.getElementById("contactForm"); const contactSubmitBtn = document.getElementById("contactSubmitBtn"); const result = document.getElementById("contactMessageResult"); if (contactForm) { contactForm.addEventListener("submit", async (event) => { event.preventDefault(); const name = document.getElementById("contactName").value.trim(); const email = document.getElementById("contactEmail").value.trim(); const subject = document.getElementById("contactSubject").value.trim(); const message = document.getElementById("contactMessage").value.trim(); if (!name || !email || !subject || !message) { result.textContent = "❌ براہِ کرم تمام معلومات مکمل کریں۔"; return; } const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; if (!emailPattern.test(email)) { result.textContent = "❌ براہِ کرم درست Email Address درج کریں۔"; return; } result.textContent = "⏳ پیغام بھیجا جا رہا ہے..."; contactSubmitBtn.disabled = true; try { const formData = new FormData(contactForm); const response = await fetch( "https://api.web3forms.com/submit", { method: "POST", body: formData, headers: { "Accept": "application/json" } } ); const data = await response.json(); if (response.ok && data.success) { result.textContent = "✅ آپ کا پیغام کامیابی سے بھیج دیا گیا ہے۔ شکریہ!"; contactForm.reset(); } else { result.textContent = "❌ پیغام نہیں بھیجا جا سکا۔ براہِ کرم دوبارہ کوشش کریں۔"; } } catch (error) { result.textContent = "❌ انٹرنیٹ یا سرور کا مسئلہ ہے۔ براہِ کرم دوبارہ کوشش کریں۔"; } contactSubmitBtn.disabled = false; }); } </script>
